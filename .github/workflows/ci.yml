name: CI

on:
  push:
    branches: [v1, dev]
  pull_request:
    branches: [v1, dev]

jobs:
  build:
    name: build (Windows · node 24.15.0)
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 24.15.0
        uses: actions/setup-node@v4
        with:
          node-version: "24.15.0"
          cache: npm

      - name: Pin npm 11.16.0
        run: npm install --global npm@11.16.0

      - name: Show runtime versions
        run: |
          node --version
          npm --version

      - name: Install dependencies
        run: npm ci

      - name: Docs gate
        run: node scripts/check-docs.mjs

      - name: Lint (biome)
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build (tsup)
        run: npm run build

      - name: Test (vitest + coverage)
        run: node scripts/ci-test-with-retry.mjs

      - name: Coverage job summary
        if: always()
        run: node scripts/coverage-summary.mjs

      # Smoke-test the bench harnesses themselves. --dry skips all LLM
      # calls, so this catches wiring regressions (task factories, CLI
      # parsing, file IO, checker determinism) without needing a
      # DEEPSEEK_API_KEY in CI.
      - name: τ-bench harness dry-run
        run: npx tsx benchmarks/tau-bench/runner.ts --dry --out (Join-Path $env:RUNNER_TEMP 'tau-dry.json')

      - name: Notify Discord on v1 failure
        if: failure() && github.event_name == 'push' && github.ref == 'refs/heads/v1'
        env:
          WEBHOOK_URL: ${{ secrets.DISCORD_CI_WEBHOOK }}
        run: |
          if (-not $env:WEBHOOK_URL) {
            Write-Host 'DISCORD_CI_WEBHOOK unset, skipping'
            exit 0
          }
          $runUrl = '${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'
          $payload = @{ content = "❌ CI failed on `${{ github.ref_name }}` (Windows) — ${{ github.actor }}`n$runUrl" } | ConvertTo-Json -Compress
          Invoke-RestMethod -Method Post -ContentType 'application/json' -Uri $env:WEBHOOK_URL -Body $payload | Out-Null
