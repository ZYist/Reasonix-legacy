name: Publish npm

# This workflow is intentionally manual. Maintainers must first push the plain
# `vX.Y.Z` tag, wait for the Windows CI and CodeQL checks on `v1`/`dev`, then
# dispatch this workflow with that exact tag. The stable artifact is npm only.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish after Windows release gates (for example v1.3.1)."
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    name: publish reasonix-legacy to npm
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0

      - name: Setup Node 24.15.0
        uses: actions/setup-node@v4
        with:
          node-version: "24.15.0"
          cache: npm
          registry-url: https://registry.npmjs.org/

      - name: Pin npm 11.16.0
        run: npm install --global npm@11.16.0

      - name: Show runtime versions
        run: |
          node --version
          npm --version

      - name: Verify tag matches package.json version
        run: |
          $tag = '${{ inputs.tag }}'
          if (-not $tag) {
            throw 'Missing tag input.'
          }
          if ($tag -notmatch '^v\d+\.\d+\.\d+$') {
            throw "Tag '$tag' must use the plain vX.Y.Z format (for example v1.3.1)."
          }
          if (-not (git tag --list $tag)) {
            throw "Tag '$tag' is not available in the checked-out repository."
          }
          $pkg = Get-Content package.json -Raw | ConvertFrom-Json
          if ($pkg.name -ne 'reasonix-legacy') {
            throw "publish workflow only supports reasonix-legacy, found '$($pkg.name)'."
          }
          $tagVersion = $tag.Substring(1)
          if ($tagVersion -ne $pkg.version) {
            throw "Tag $tag (version $tagVersion) does not match package.json version $($pkg.version)."
          }
          Write-Host "Tag $tag matches reasonix-legacy $($pkg.version)"

      - name: Install dependencies
        run: npm ci

      - name: Lint (biome)
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build (tsup)
        run: npm run build

      - name: Docs gate
        run: node scripts/check-docs.mjs

      - name: Test (vitest + coverage)
        run: node scripts/ci-test-with-retry.mjs

      - name: τ-bench harness dry-run
        run: npx tsx benchmarks/tau-bench/runner.ts --dry --out (Join-Path $env:RUNNER_TEMP 'tau-dry.json')

      - name: Publish to npm
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
